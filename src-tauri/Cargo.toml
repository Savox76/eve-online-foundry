[package]
name = "new-eden-foundry"
version = "0.3.0" # x-release-please-version
description = "Industrie-Werkzeug fuer EVE Online"
authors = ["Savox76"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "foundry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
base64 = "0.23"
log = "0.4"

[features]
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
