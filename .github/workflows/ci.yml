name: CI

# Es werden bewusst KEINE Build-Ergebnisse gespeichert: keine Container-Images,
# keine Actions-Artefakte, keine Dateien an Releases. GitHub haelt Quelltext,
# Pruefungen und Release Notes -- gebaut wird dort, wo Foundry laeuft
# (Kapitel 16). Die einzige Ausnahme sind spaeter die fertigen Installer in
# release.yml, weil der Updater sie irgendwo herunterladen muss.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  secrets:
    name: Geheimnisse
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action liest ab v3 die Metadaten des Pull Requests, um nur
      # dessen Commits zu pruefen statt der ganzen Historie.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Ab v3 Pflicht fuer PR-Scans -- ohne ihn bricht der Job mit
          # "GITHUB_TOKEN is now required to scan pull requests" ab. Unter v2
          # ist die Variable wirkungslos, sie steht hier also vor dem
          # Versionssprung und nicht danach.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Abhaengigkeiten
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: ruff
        run: .venv/bin/ruff check app tests

      - name: ruff format
        run: .venv/bin/ruff format --check app tests

      - name: mypy
        run: .venv/bin/mypy app

      - name: bandit
        run: .venv/bin/bandit -q -c pyproject.toml -r app

      - name: Migration gegen eine Wegwerf-Datenbank
        # Beweist, dass die Migrationen aus dem Nichts durchlaufen -- und dank
        # downgrade auch, dass sie vollstaendig geschrieben sind.
        env:
          FOUNDRY_DATA_DIR: ${{ runner.temp }}/foundry-ci
        run: |
          mkdir -p "$FOUNDRY_DATA_DIR"
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head

      - name: SDE-Import gegen die synthetischen Demo-Daten
        env:
          FOUNDRY_DATA_DIR: ${{ runner.temp }}/foundry-ci
        run: .venv/bin/python -m app.sde.importer --source ../demo/sde --build ci

      - name: pytest
        env:
          FOUNDRY_DATA_DIR: ${{ runner.temp }}/foundry-tests
        run: |
          mkdir -p "$FOUNDRY_DATA_DIR"
          .venv/bin/pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: tsc --noEmit
        run: npm run typecheck
      - name: vitest
        run: npm run test
      - name: Build als reine Pruefung
        run: npm run build

  shell:
    name: Schale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Systembibliotheken fuer Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libsoup-3.0-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Attrappen fuer die Pruefung anlegen
        # Zwei Dinge erwartet das Tauri-Build-Skript, die es in einem reinen
        # Pruefungslauf nicht gibt -- und ohne sie bricht es mit Exitcode 101
        # ab, bevor auch nur eine Zeile Rust uebersetzt wird:
        #
        #   frontendDist   ../frontend/dist
        #   externalBin    binaries/foundry-backend-<target-triple>
        #
        # Den Sidecar hier wirklich zu buendeln waere Minuten fuer nichts: der
        # Job prueft Rust-Code, er baut keinen Installer. Der Dateiname kommt
        # aus scripts/build_sidecar.py, damit die Triple-Regel eine einzige
        # Quelle behaelt -- ein falsch benannter Sidecar wird sonst kommentarlos
        # nicht gefunden.
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html>' > frontend/dist/index.html

          ziel=$(python3 scripts/build_sidecar.py --check | sed -n 's/^Tauri erwartet: //p')
          test -n "$ziel" || { echo "Sidecar-Name nicht ermittelbar"; exit 1; }
          mkdir -p "$(dirname "$ziel")"
          printf '#!/bin/sh\nexit 0\n' > "$ziel"
          chmod +x "$ziel"
          echo "Attrappe angelegt: $ziel"

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        # Die Schale hat wenig Code, aber der wenige ist heikel: das
        # Sitzungsgeheimnis ist das Einzige, was den Loopback-Server von jedem
        # anderen Prozess auf dem Rechner trennt.
        working-directory: src-tauri
        run: cargo test --lib
