[project]
name = "foundry-backend"
version = "0.4.0" # x-release-please-version
description = "New Eden Foundry — Backend-Sidecar (FastAPI, SQLite)"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "httpx>=0.27",
    "apscheduler>=3.11",
    "keyring>=25.5",
    "pyjwt[crypto]>=2.10",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
    "bandit>=1.8",
]
# Nur fuers Buendeln zum Sidecar. Steht bewusst nicht in [dev]: wer am Backend
# arbeitet, braucht PyInstaller nicht, und es zieht eine Menge mit.
bundle = [
    "pyinstaller>=6.11",
]

[project.scripts]
foundry-backend = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "DTZ",      # naive datetimes -- relevant, ESI rechnet durchgaengig in UTC
    "T20",      # print()
    "SIM",
    "RUF",
]
ignore = ["B008"]  # FastAPI-Depends im Default-Argument ist hier idiomatisch

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# N818 verlangt das Suffix "Error" an Ausnahmen. Hier heissen die Klassen nach
# dem HTTP-Zustand, den sie beschreiben (EsiForbidden, EsiRateLimited) -- so
# liest sich der except-Block wie die ESI-Dokumentation. "EsiErrorLimitedError"
# waere die Alternative, und die liest niemand gern.
"app/esi/errors.py" = ["N818"]
"app/sde/importer.py" = ["T20"]   # CLI-Ausgabe ist hier der Zweck
"app/main.py" = ["T20"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "keyring.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/api/v1/_stubs.py"]

# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "alembic"]
